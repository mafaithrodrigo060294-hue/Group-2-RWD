<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bootstrap Framework Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 2rem;
            font: 16px Arial, sans-serif;
            color: #E8F1FF;
            background: #080B14;
            overflow-x: hidden;
            position: relative;
            isolation: isolate;
        }

        /* ANIMATED CYBERPUNK BACKGROUND */

        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            z-index: -2;
            pointer-events: none;

            background:
                radial-gradient(circle at 20% 30%, #00E5FF30, transparent 25%),
                radial-gradient(circle at 80% 20%, #FF149328, transparent 25%),
                radial-gradient(circle at 60% 80%, #DFFF0020, transparent 25%);

            animation: backgroundMove 14s ease-in-out infinite alternate;
        }

        /* NEON GRID */

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(#00E5FF12 1px, transparent 1px),
                linear-gradient(90deg, #00E5FF12 1px, transparent 1px);

            background-size: 45px 45px;

            mask-image: linear-gradient(to bottom,
                    black,
                    transparent 95%);
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(-3%, -2%) rotate(0deg) scale(1);
            }

            100% {
                transform: translate(3%, 2%) rotate(8deg) scale(1.1);
            }
        }

        /* RESIZABLE PREVIEW WINDOW */

        .resize-window {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 680px;
            min-width: 280px;
            min-height: 350px;

            margin: auto;
            padding: 1.3rem;

            border: 1px solid #00E5FF88;
            border-radius: 18px;

            background: linear-gradient(145deg,
                    #151B2BEE,
                    #101625F2);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 0 25px #00E5FF25,
                0 0 60px #FF149315,
                inset 0 1px 1px #ffffff20;

            overflow: hidden;
        }

        .preview {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px;
            background: #080B14;
        }

        /* RESIZE HANDLE */

        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;

            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #FF1493;
            border-radius: 12px 0 17px 0;

            box-shadow: 0 0 15px #FF149388;

            cursor: nwse-resize;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            z-index: 10;
        }

        .resize-handle span {
            width: 13px;
            height: 13px;

            border-right: 3px solid white;
            border-bottom: 3px solid white;

            transform: translate(-2px, -2px);
        }

        .resize-handle:hover,
        .resize-handle:active {
            background: #00E5FF;
            box-shadow: 0 0 25px #00E5FF;
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem;
            }

            .resize-window {
                min-width: 280px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        /* MOUSE AND TOUCH RESIZING */

        const container = document.getElementById("resizeWindow");
        const handle = document.getElementById("resizeHandle");

        let startX = 0;
        let startY = 0;
        let startWidth = 0;
        let startHeight = 0;

        handle.addEventListener("pointerdown", function (e) {

            if (e.button !== 0) return;

            e.preventDefault();

            startX = e.clientX;
            startY = e.clientY;

            startWidth = container.offsetWidth;
            startHeight = container.offsetHeight;

            handle.setPointerCapture(e.pointerId);
        });

        handle.addEventListener("pointermove", function (e) {

            if (!handle.hasPointerCapture(e.pointerId)) return;

            const newWidth = startWidth + (e.clientX - startX);
            const newHeight = startHeight + (e.clientY - startY);

            const parentWidth = container.parentElement.clientWidth;

            const maxWidth = Math.min(1000, parentWidth);
            const maxHeight = window.innerHeight * 0.9;

            container.style.width =
                Math.min(maxWidth, Math.max(280, newWidth)) + "px";

            container.style.height =
                Math.min(maxHeight, Math.max(350, newHeight)) + "px";
        });

        function stopResizing(e) {
            if (handle.hasPointerCapture(e.pointerId)) {
                handle.releasePointerCapture(e.pointerId);
            }
        }

        handle.addEventListener("pointerup", stopResizing);
        handle.addEventListener("pointercancel", stopResizing);
    </script>
